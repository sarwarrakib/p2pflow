services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: p2pflow
      MYSQL_USER: p2pflow
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - p2pflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -up2pflow -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      P2PFLOW_VERSION: 2.0.8
      P2PFLOW_ENV: production
      P2PFLOW_LISTEN: :8080
      P2PFLOW_PUBLIC_DIR: /app/web
      P2PFLOW_MIGRATION_DIR: /app/migrations
      P2PFLOW_UPLOAD_DIR: /app/data/uploads
      P2PFLOW_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      P2PFLOW_SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      DB_DRIVER: mysql
      DB_URL: p2pflow:${DB_PASSWORD}@tcp(db:3306)/p2pflow?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      P2PFLOW_AUTO_MIGRATE: "true"
      P2PFLOW_WORKERS: "false"
      NATS_URL: nats://nats:4222
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
      BILLING_DEFAULT_PROVIDER: ${BILLING_DEFAULT_PROVIDER:-manual}
      BILLING_CHECKOUT_URL: ${BILLING_CHECKOUT_URL:-}
      BILLING_CHECKOUT_API_KEY: ${BILLING_CHECKOUT_API_KEY:-}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-BDT}
      BILLING_GRACE_PERIOD: ${BILLING_GRACE_PERIOD:-72h}
      BILLING_INVOICE_LEAD: ${BILLING_INVOICE_LEAD:-168h}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-P2PFlow}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      P2PFLOW_PUSH_TTL: ${P2PFLOW_PUSH_TTL:-5m}
      P2PFLOW_PUSH_DELIVERY_CONCURRENCY: ${P2PFLOW_PUSH_DELIVERY_CONCURRENCY:-8}
      P2PFLOW_EXTENSION_TOKEN: ${P2PFLOW_EXTENSION_TOKEN:-}
      P2PFLOW_UPDATE_RELEASE_DIR: /app/data/system-updates
      P2PFLOW_UPDATE_PUBLIC_KEY: ${P2PFLOW_UPDATE_PUBLIC_KEY:-}
      P2PFLOW_UPDATE_REQUIRE_SIGNATURE: ${P2PFLOW_UPDATE_REQUIRE_SIGNATURE:-true}
      P2PFLOW_UPDATE_MAX_ARTIFACT_BYTES: ${P2PFLOW_UPDATE_MAX_ARTIFACT_BYTES:-536870912}
      P2PFLOW_UPDATE_CURRENT_LINK: /app/data/system-updates/current
    ports:
      - "8080:8080"
    volumes:
      - p2pflow_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    entrypoint: ["/app/p2pflow-worker"]
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    environment:
      P2PFLOW_VERSION: 2.0.8
      P2PFLOW_ENV: production
      P2PFLOW_MIGRATION_DIR: /app/migrations
      P2PFLOW_UPLOAD_DIR: /app/data/uploads
      DB_DRIVER: mysql
      DB_URL: p2pflow:${DB_PASSWORD}@tcp(db:3306)/p2pflow?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      APP_SECRET: ${APP_SECRET}
      P2PFLOW_AUTO_MIGRATE: "false"
      P2PFLOW_WORKERS: "true"
      NATS_URL: nats://nats:4222
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
      BILLING_DEFAULT_PROVIDER: ${BILLING_DEFAULT_PROVIDER:-manual}
      BILLING_CHECKOUT_URL: ${BILLING_CHECKOUT_URL:-}
      BILLING_CHECKOUT_API_KEY: ${BILLING_CHECKOUT_API_KEY:-}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-BDT}
      BILLING_GRACE_PERIOD: ${BILLING_GRACE_PERIOD:-72h}
      BILLING_INVOICE_LEAD: ${BILLING_INVOICE_LEAD:-168h}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-P2PFlow}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      P2PFLOW_PUSH_TTL: ${P2PFLOW_PUSH_TTL:-5m}
      P2PFLOW_PUSH_DELIVERY_CONCURRENCY: ${P2PFLOW_PUSH_DELIVERY_CONCURRENCY:-8}
      P2PFLOW_EXTENSION_TOKEN: ${P2PFLOW_EXTENSION_TOKEN:-}
    volumes:
      - p2pflow_data:/app/data

volumes:
  p2pflow_mysql:
  p2pflow_data:
