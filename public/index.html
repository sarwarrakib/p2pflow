<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="/manifest.webmanifest?v=1.5.29" />
  <title>P2PFlow | অপারেশন প্যানেল</title>
  <link rel="stylesheet" href="/style.css?v=1.5.29" />
</head>
<body>
  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="logo">P2P</div>
        <div class="brand-copy">
          <h2>P2PFlow</h2>
          <span id="userBadge"></span>
        </div>
        <button id="mobileMenuClose" class="mobile-menu-close" type="button" aria-label="Close menu" title="Close menu">&times;</button>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div id="sidebarRuntime" class="sidebar-runtime">
          <span class="sidebar-status-dot" aria-hidden="true"></span>
          <span id="sidebarServerStatus">Server Online</span>
          <small id="sidebarVersion">Version</small>
        </div>
        <button id="logoutBtn" class="sidebar-logout full" type="button"><span class="sidebar-logout-icon" aria-hidden="true">↪</span><span>Logout</span></button>
      </div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-main">
          <button id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu" title="Open menu">
            <span class="hamburger-bars" aria-hidden="true"></span>
          </button>
          <div class="topbar-copy">
            <h1 id="pageTitle">Dashboard</h1>
            <p id="pageSubtitle" class="hidden"></p>
          </div>
        </div>
        <div class="top-actions">
          <button id="globalWorkAvailabilityToggle" class="order-acceptance-toggle compact hidden" type="button" data-order-acceptance-toggle aria-pressed="false" title="Work status"><span class="order-acceptance-dot" aria-hidden="true"></span><span>Work</span></button>
          <div class="language-switch" aria-label="Language selector">
            <span>EN</span>
            <button id="langToggle" class="lang-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch between English and Bangla"><span class="lang-toggle-thumb" aria-hidden="true"></span></button>
            <span>BN</span>
          </div>
          <div class="status-pill hidden" id="liveStatus">Offline</div>
          <div class="notification-center" id="notificationCenter">
            <button id="notificationBtn" class="notification-btn" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notificationPanel">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
              <span id="notificationBadge" class="notification-badge hidden">0</span>
            </button>
            <div id="notificationPanel" class="notification-panel hidden" role="dialog" aria-label="Notifications"></div>
          </div>
        </div>
      </header>
      <section id="content" tabindex="-1"></section>
    </main>
    <nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="Persistent mobile navigation"></nav>
  </div>

  <template id="modalTemplate">
    <div class="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
        <div class="modal-head">
          <h3></h3>
          <button type="button" class="icon close-modal" aria-label="Close dialog">&times;</button>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </template>

  <script src="/js/pages/dashboard.js?v=1.5.29"></script>
  <script src="/js/pages/p2p-market.js?v=1.5.29"></script>
  <script src="/js/pages/orders.js?v=1.5.29"></script>
  <script src="/js/pages/chat.js?v=1.5.29"></script>
  <script src="/js/pages/ads.js?v=1.5.29"></script>
  <script src="/js/pages/approvals.js?v=1.5.29"></script>
  <script src="/js/pages/accounts.js?v=1.5.29"></script>
  <script src="/js/pages/offline-transactions.js?v=1.5.29"></script>
  <script src="/js/pages/ledger.js?v=1.5.29"></script>
  <script src="/js/pages/users.js?v=1.5.29"></script>
  <script src="/js/pages/user-roles.js?v=1.5.29"></script>
  <script src="/js/pages/routing.js?v=1.5.29"></script>
  <script src="/js/pages/reports.js?v=1.5.29"></script>
  <script src="/js/pages/accounting.js?v=1.5.29"></script>
  <script src="/js/pages/activity.js?v=1.5.29"></script>
  <script src="/js/pages/credentials.js?v=1.5.29"></script>
  <script src="/js/pages/health.js?v=1.5.29"></script>
  <script src="/js/pages/settings.js?v=1.5.29"></script>
  <script src="/js/pages/system-update.js?v=1.5.29"></script>
  <script src="/js/pages/p2p-extension.js?v=1.5.29"></script>
  <script src="/js/pages/p2p-profile.js?v=1.5.29"></script>
  <script src="/js/pages/security.js?v=1.5.29"></script>
  <script src="/js/pages/notifications.js?v=1.5.29"></script>
  <script src="/js/pages/audit.js?v=1.5.29"></script>
  <script src="/device-auth.js?v=1.5.29"></script>
  <script src="/app.js?v=1.5.29"></script>
</body>
</html>
