name: Build and publish P2PFlow release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION=${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Static project QA
        run: ./scripts/qa.sh

      - name: Build Linux amd64 binaries
        env:
          GOOS: linux
          GOARCH: amd64
        run: ./scripts/build.sh

      - name: Package runtime
        shell: bash
        run: |
          set -euo pipefail
          NAME="P2PFlow_v${VERSION}_linux_amd64"
          mkdir -p "dist/$NAME"
          cp -a bin web migrations deploy scripts docs VERSION README.md .env.example install.sh "dist/$NAME/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="dist/P2PFlow_v${VERSION}_linux_amd64.tar.gz"
          SUM="${ASSET}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "$SUM" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" "$SUM" --title "P2PFlow ${VERSION}" --generate-notes
          fi
